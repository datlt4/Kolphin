[package]
name = "kolphin"
description = "Koi's Dolphin: a fast file manager for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_1"] }
async-channel = "2"
imagesize = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
libc = "0.2"
md-5 = "0.10"
png = "0.18"
sha2 = "0.10"
toml = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
resvg = { version = "0.49", default-features = false }
serde_json = "1"
ureq = "3"

[package.metadata.deb]
name = "kolphin"
maintainer = "datlt4 <dat@vizgard.com>"
section = "utils"
depends = "$auto"
assets = [
    ["target/release/kolphin", "usr/bin/", "755"],
    ["../assets/kolphin.desktop", "usr/share/applications/", "644"],
    ["../assets/icons/kolphin-32.png", "usr/share/icons/hicolor/32x32/apps/kolphin.png", "644"],
    ["../assets/icons/kolphin-128.png", "usr/share/icons/hicolor/128x128/apps/kolphin.png", "644"],
    ["../assets/icons/kolphin-256.png", "usr/share/icons/hicolor/256x256@2/apps/kolphin.png", "644"],
]
